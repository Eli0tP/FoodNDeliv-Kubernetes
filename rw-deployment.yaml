apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: foodndeliv-rw
  name: foodndeliv-rw-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodndeliv-rw
  template:
    metadata:
      labels:
        app: foodndeliv-rw
    spec:
      containers:
      - env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://foodndeliv-postgres-cluster-rw:5432/foodndeliv_db
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: foodndeliv-postgres-cluster-app
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: foodndeliv-postgres-cluster-app
        - name: IAM_CLIENT_SECRET
          value: "change-me"
        - name: IAM_PASSWORD
          value: "change-me"
        - name: IAM_USERNAME
          value: "admin"
        - name: IAM_URL
          value: "http://my-keycloak"
        image: docker.io/eliotp/foodndeliv-rw:latest
        imagePullPolicy: IfNotPresent
        name: foodndeliv-rw-app
        ports:
        - containerPort: 8080