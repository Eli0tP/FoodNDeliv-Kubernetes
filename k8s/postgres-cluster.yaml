apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: foodndeliv-postgres-cluster
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  
  bootstrap:
    initdb:
      database: foodndeliv
      owner: app_user
      secret:
        name: foodndeliv-db-secret

  storage:
    size: 1Gi
    storageClass: standard